{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Pay Supplier</h2>
            <p class="text-muted">{{ supplier.name }}</p>
        </div>
        <a href="{% url 'supplier_detail' supplier.id %}" class="btn btn-secondary">← Back</a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="alert alert-info">
                <strong>Current Credit Balance:</strong> UGX {{ supplier.credit_balance|floatformat:0 }}
            </div>

            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label">Amount to Pay (UGX)</label>
                    <input type="number" name="amount" class="form-control" step="0.01" min="1" required>
                </div>

                <button type="submit" class="btn btn-success">Record Payment</button>
                <a href="{% url 'supplier_detail' supplier.id %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>

{% endblock %}
