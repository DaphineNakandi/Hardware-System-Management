{% extends 'base.html' %} {% block content %}

<div class="container mt-4">
  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2>Stock History: {{ product.name }}</h2>
      <p class="text-muted">
        {{ product.specification|default:"No specification" }}
      </p>
    </div>

    <a href="{% url 'product_list' %}" class="btn btn-secondary">
      &larr; Back
    </a>
  </div>

  <!-- SUMMARY CARDS -->
  <div class="row mb-4">
    <div class="col-md-4">
      <div class="card text-center">
        <div class="card-body">
          <h3>{{ product.current_quantity }}</h3>
          <p>Current Stock</p>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card text-center">
        <div class="card-body">
          <h3>{{ product.reorder_level }}</h3>
          <p>Reorder Level</p>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card text-center">
        <div class="card-body">
          <h3>{{ stock_entries|length }}</h3>
          <p>Stock Entries</p>
        </div>
      </div>

      {% endblock %}
    </div>
  </div>
</div>
